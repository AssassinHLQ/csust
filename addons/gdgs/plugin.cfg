[plugin]

name="gdgs"
description="Import, render, relight, and generate collision for 3D Gaussian Splatting assets (.ply, .compressed.ply, .splat, .sog, .glb, .usdz). Compositor-based hybrid rendering with scene-depth occlusion. Requires Godot 4.3+ with the Forward Plus renderer. [gsplat-stream fork: packed 52-76 B splat records, adaptive sort/cull budgets, 10M-splat Compute support, octree streaming LOD for 50M+ splats, optional 24 B q24 stream records. Based on GDGS by ReconWorldLab (MIT).]"
author="ReconWorldLab (original GDGS); AssassinHLQ (fork modifications only)"
version="3.3.0-gsplat-stream.5"
script="plugin.gd"
